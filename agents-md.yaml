# The template identifier. `compass-core` is the repo that actually hosts
# `templates/CLAUDE.md.template`; assay still carries the older value
# `compass-standards`, which names no repo in the org. Nothing reads this
# field yet, so it is set to what is true rather than to the stale precedent.
template: compass-core
generate:
  - format: claude-md
repo_name: crucible
repo_description: "The infrastructure factory — deterministic, digest-identified test environments for the metafactory ecosystem"
deploy_command: "arc upgrade crucible"
version_source: arc-manifest.yaml
sections:
  - position: "after:description"
    file: docs/agents-md/architecture.md
  - position: "after:critical-rules"
    file: docs/agents-md/critical-rules.md
